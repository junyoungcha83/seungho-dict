<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>승호의사전</title>
<link rel="stylesheet" href="assets/app.css" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="승호의사전" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
</head>
<body>
<!-- 첫 화면: 사진 한 장을 배경화면처럼 꽉 채우고 5초 뒤(또는 탭하면 바로) 검색 화면으로 -->
<div class="splash" id="splash" role="button" tabindex="0" aria-label="탭하면 검색 화면으로 넘어갑니다">
  <div class="splash-img">
    <p class="splash-title"><span>승호의<br />영어사전</span></p>
  </div>
  <div class="splash-foot">
    <div class="splash-bar" role="progressbar" aria-label="불러오는 중"><i></i></div>
    <p class="splash-hint">불러오는 중… <span>화면을 누르면 바로 시작</span></p>
  </div>
</div>

<div class="topbar">
<header class="app-header">
  <h1>📖 승호의사전</h1>
  <span class="ver" id="ver"></span>
  <div class="acc" id="acc" role="group" aria-label="발음 선택">
    <button data-a="us" class="on">US</button>
    <button data-a="uk">UK</button>
  </div>
</header>
<nav class="tabbar" id="tabbar" role="tablist" aria-label="화면 선택">
  <button class="tab-btn active" data-tab="word"  role="tab" aria-selected="true"><span>🔤</span>단어검색</button>
  <button class="tab-btn"        data-tab="ex"    role="tab" aria-selected="false"><span>💬</span>예문검색</button>
  <button class="tab-btn"        data-tab="fav"   role="tab" aria-selected="false"><span>⭐</span>즐겨찾기</button>
  <button class="tab-btn"        data-tab="stats" role="tab" aria-selected="false"><span>📊</span>통계</button>
</nav>
</div>

<!-- ── 탭 1: 단어검색 ── -->
<section class="panel" id="panelWord" data-tab="word">
  <div class="search-wrap">
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off"
           placeholder="한글 또는 영어 단어 검색" aria-label="단어 검색" />
    <button id="go" aria-label="검색">🔍</button>
  </div>
  <main id="result" class="result">
    <div class="empty" id="empty">
      <p>한글을 입력하면 <b>영어 뜻</b>, 영어를 입력하면 <b>한글 뜻</b>을 보여줍니다.</p>
      <p class="sub">발음기호·스피커 발음·예문·숙어까지 무료로, 오프라인에서도.</p>
    </div>
  </main>
</section>

<!-- ── 탭 2: 예문검색 ── -->
<section class="panel hidden" id="panelEx" data-tab="ex">
  <div class="search-wrap">
    <input id="qEx" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off"
           placeholder="영어 단어로 예문 찾기" aria-label="예문 검색" />
    <button id="goEx" aria-label="예문 검색">🔍</button>
  </div>
  <main id="exResult" class="result">
    <div class="empty">
      <p>영어 단어를 넣으면 그 단어가 들어간 <b>예문</b>을 보여줍니다.</p>
      <p class="sub">쉬운 문장부터 5개 이상 · 🔊를 누르면 소리로 읽어 줍니다.</p>
    </div>
    <div class="recent" id="exSuggest"></div>
  </main>
</section>

<!-- ── 탭 3: 즐겨찾기 (최근 검색 포함) ── -->
<section class="panel hidden" id="panelFav" data-tab="fav">
  <main class="result">
    <div class="fav" id="fav"></div>
    <div class="recent" id="recent"></div>
    <div class="empty hidden" id="favEmpty">
      <p>아직 즐겨찾기한 단어가 없어요.</p>
      <p class="sub">단어를 찾은 뒤 ☆ 를 누르면 여기에 모입니다.</p>
    </div>
  </main>
</section>

<!-- ── 탭 4: 통계 ── -->
<section class="panel hidden" id="panelStats" data-tab="stats">
  <main class="result">
    <div class="stats-head">
      <b>주간 검색 건수</b>
      <span id="statsSum"></span>
    </div>
    <div class="stats-chart" id="statsChart"></div>
    <p class="stats-cap">선 = 주간 합계 · 점 위 숫자 = 하루 평균</p>
  </main>
</section>



<script src="assets/stats.js"></script>
<script src="assets/word.js"></script>
<script src="assets/app.js"></script>
<script src="assets/splash.js"></script>
<script>
  // 새 버전이 올라와도 이미 떠 있는 앱은 옛 코드를 계속 쓴다. 그래서
  //  ① 새 워커가 제어권을 잡으면 한 번 새로고침해 새 코드로 갈아탄다
  //  ② 화면으로 돌아올 때마다 새 버전이 있는지 확인한다
  //     — 폰에서 앱을 백그라운드에 두면 새로 여는 일이 없어 영영 갱신되지 않았다
  //       (화면의 버전이 v7 에 머물러 있던 원인)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return; reloaded = true; location.reload();
    });
    addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
